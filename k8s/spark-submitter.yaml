apiVersion: v1
kind: Pod
metadata:
  name: spark-submitter
  namespace: streaming
spec:
  serviceAccountName: spark
  restartPolicy: Never
  containers:
    - name: spark-submitter
      image: shobika25/spark-kafka-iceberg:1.4
      imagePullPolicy: Always
      command: ["/bin/bash", "-c", "sleep 3600"]
